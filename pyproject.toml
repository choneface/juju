[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "juju-ipc"
version = "0.1.0"
description = "A tiny concurrent IPC testing tool."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "juju contributors" }]
license = { text = "MIT" }
keywords = ["ipc", "testing", "concurrency", "jsonlines"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
]

[project.scripts]
juju = "juju.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
